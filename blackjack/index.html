<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blackjack (21)</title>
  <link rel="stylesheet" href="../fig.css">
  <link rel="stylesheet" href="blackjack.css">
</head>
<body>
  <main class="blackjack-shell">
    <div class="table-header">
      <div>
        <p class="eyebrow">CASINO TABLE</p>
        <h1>Blackjack (21)</h1>
      </div>
      <div class="balance-box">
        <span>Chips</span>
        <strong id="chips">100</strong>
      </div>
    </div>

    <div class="status-row">
      <label class="bet-wrap" for="bet">
        <span>Bet</span>
        <input id="bet" type="number" min="1" max="1000" value="10">
      </label>

      <div class="button-row">
        <button id="dealBtn" class="button button-primary">Deal</button>
        <button id="hitBtn" class="button button-secondary" disabled>Hit</button>
        <button id="standBtn" class="button button-secondary" disabled>Stand</button>
        <button id="newRoundBtn" class="button button-ghost" disabled>New Round</button>
      </div>
    </div>

    <div class="table-surface">
      <div class="hand-box">
        <div class="hand-label-row">
          <h3>Dealer</h3>
          <span id="dealer-value" class="hand-value"></span>
        </div>
        <div id="dealer" class="hand" aria-live="polite"></div>
      </div>

      <div class="hand-box">
        <div class="hand-label-row">
          <h3>Player</h3>
          <span id="player-value" class="hand-value"></span>
        </div>
        <div id="player" class="hand" aria-live="polite"></div>
      </div>
    </div>

    <div id="message" class="message" aria-live="polite">Place your bet and deal.</div>
  </main>

  <script src="blackjack.js"></script>
</body>
</html>
