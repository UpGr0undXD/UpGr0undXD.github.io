<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学求解器 - 方程求解工具</title>
    <link rel="stylesheet" href="math-solver.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📐 数学求解器</h1>
            <p class="subtitle">快速求解一元和二元方程</p>
        </header>

        <main>
            <!-- 选项卡 -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="linear">一元一次方程</button>
                <button class="tab-btn" data-tab="quadratic">一元二次方程</button>
                <button class="tab-btn" data-tab="system">二元一次方程组</button>
            </div>

            <!-- 一元一次方程 -->
            <section id="linear" class="tab-content active">
                <div class="form-group">
                    <label>输入方程 (格式: ax + b = c)</label>
                    <input type="text" id="linear-input" placeholder="例如: 2x + 3 = 7" class="input-field">
                    <small>或使用系数输入</small>
                </div>
                <div class="coeff-group">
                    <div class="coeff-item">
                        <label>a (x的系数)</label>
                        <input type="number" id="linear-a" placeholder="0" step="0.01">
                    </div>
                    <div class="coeff-item">
                        <label>b (常数)</label>
                        <input type="number" id="linear-b" placeholder="0" step="0.01">
                    </div>
                    <div class="coeff-item">
                        <label>c (右边)</label>
                        <input type="number" id="linear-c" placeholder="0" step="0.01">
                    </div>
                </div>
                <button class="solve-btn" onclick="solveLinear()">求解 ax + b = c</button>
                <div id="linear-result" class="result-box"></div>
            </section>

            <!-- 一元二次方程 -->
            <section id="quadratic" class="tab-content">
                <div class="form-group">
                    <label>输入方程 (格式: ax² + bx + c = 0)</label>
                    <input type="text" id="quadratic-input" placeholder="例如: x² - 5x + 6 = 0" class="input-field">
                    <small>或使用系数输入</small>
                </div>
                <div class="coeff-group">
                    <div class="coeff-item">
                        <label>a (x²的系数)</label>
                        <input type="number" id="quad-a" placeholder="1" step="0.01">
                    </div>
                    <div class="coeff-item">
                        <label>b (x的系数)</label>
                        <input type="number" id="quad-b" placeholder="0" step="0.01">
                    </div>
                    <div class="coeff-item">
                        <label>c (常数)</label>
                        <input type="number" id="quad-c" placeholder="0" step="0.01">
                    </div>
                </div>
                <button class="solve-btn" onclick="solveQuadratic()">求解 ax² + bx + c = 0</button>
                <div id="quadratic-result" class="result-box"></div>
            </section>

            <!-- 二元一次方程组 -->
            <section id="system" class="tab-content">
                <div class="form-group">
                    <label>方程1: a₁x + b₁y = c₁</label>
                    <div class="system-inputs">
                        <input type="number" id="sys-a1" placeholder="a₁" step="0.01">
                        <span>x +</span>
                        <input type="number" id="sys-b1" placeholder="b₁" step="0.01">
                        <span>y =</span>
                        <input type="number" id="sys-c1" placeholder="c₁" step="0.01">
                    </div>
                </div>
                <div class="form-group">
                    <label>方程2: a₂x + b₂y = c₂</label>
                    <div class="system-inputs">
                        <input type="number" id="sys-a2" placeholder="a₂" step="0.01">
                        <span>x +</span>
                        <input type="number" id="sys-b2" placeholder="b₂" step="0.01">
                        <span>y =</span>
                        <input type="number" id="sys-c2" placeholder="c₂" step="0.01">
                    </div>
                </div>
                <button class="solve-btn" onclick="solveSystem()">求解方程组</button>
                <div id="system-result" class="result-box"></div>
            </section>
        </main>

        <footer>
            <p>💡 提示：如需扩展功能，可启动Python后端服务 | <a href="../">返回首页</a></p>
        </footer>
    </div>

    <script src="math-solver.js"></script>
</body>
</html>
